  CatgridTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CatgridTests
    dependencies:
      - target: Catgrid
      - package: NonogramKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.catgridcollection.nonogram.tests

  CatgridUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CatgridUITests
    dependencies:
      - target: Catgrid
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.catgridcollection.nonogram.uitests
        TEST_TARGET_NAME: Catgrid

schemes:
  Catgrid:
    run:
      # App Store Connect'te ürün tanımlanmadan simülatörde satın almayı denemek için
      storeKitConfiguration: Catgrid/Resources/Catgrid.storekit
    build:
      targets:
        Catgrid: all
        CatgridTests: [test]
        CatgridUITests: [test]
    test:
      targets: [CatgridTests, CatgridUITests]
      gatherCoverageData: true

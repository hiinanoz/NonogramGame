name: Catgrid

options:
  bundleIdPrefix: com.catgridcollection   # App Store Connect'te kaydedilen kimlikle aynı olmalı
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  NonogramKit:
    path: Packages/NonogramKit
  # 11.5.0: Xcode 15.2 ile çalışan son sürüm. 11.6.0+ MarketplaceKit kullanır ve Xcode 15.3 ister
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    exactVersion: 11.5.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    majorVersion: 2.1.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""              # Kendi Team ID'n
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Catgrid:
    type: application
    platform: iOS
    sources:
      - path: Catgrid
        excludes:
          - Resources/Catgrid.storekit   # yalnızca Xcode'da yerel satın alma testi için
          - Resources/PrivacyInfo.xcprivacy
          - Resources/Catgrid.entitlements
      # Apple'ın zorunlu gizlilik bildirimi; kaynak olarak pakete girmeli
      - path: Catgrid/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: NonogramKit
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catgridcollection.nonogram
        OTHER_LDFLAGS: $(inherited) -ObjC   # Google Mobile Ads SDK gereği
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Game Center (sıralama listeleri)
    entitlements:
      path: Catgrid/Resources/Catgrid.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: Catgrid/Resources/Info.plist
      properties:
        CFBundleDisplayName: Catgrid
        # Sürüm ve derleme numarası yukarıdaki MARKETING_VERSION / CURRENT_PROJECT_VERSION'dan;
        # App Store'a her yüklemede CURRENT_PROJECT_VERSION bir artırılmalı
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        CFBundleLocalizations: [en, tr, ja, de, fr, es, pt-BR, ko]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground   # açılışta temanın zemini (koyu modda beyaz parlama olmasın)
        # iOS 26'nın yeni (Liquid Glass) görünümü yerine bugünkü tasarım korunur
        UIDesignRequiresCompatibility: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # AdMob uygulama kimliği (Catgrid, iOS)
        GADApplicationIdentifier: ca-app-pub-7892998113103360~7845754820
        NSUserTrackingUsageDescription: Allowing tracking lets us show you more relevant ads. Ads help keep Catgrid free to play.
        # Google'ın yayımladığı liste: developers.google.com/admob/ios/3p-skadnetworks (Ekim 2026)
